<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salt Shack Shapes</title>
<meta name="description" content="An 8-bit surf shop game: shape boards from wood to foam and longboard to shortboard, then surf them.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: one-column arcade cabinet. Pixel stage on top, a shop "console" panel underneath that changes with each screen. Single deliberate dark look (Sweetie-16 palette). */
:root{
  --k:#1a1c2c; --plum:#5d275d; --red:#b13e53; --orange:#ef7d57; --sun:#ffcd75; --lime:#a7f070;
  --green:#38b764; --teal:#257179; --navy:#29366f; --blue:#3b5dc9; --sky:#41a6f6; --aqua:#73eff7;
  --white:#f4f4f4; --mist:#94b0c2; --slate:#566c86; --dusk:#333c57;
  --f-display:"Press Start 2P", ui-monospace, "Courier New", monospace;
  --f-body:"VT323", ui-monospace, "Courier New", monospace;
  color-scheme: dark;
}
html,body{background:var(--k);color:var(--white);height:auto}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{font-family:var(--f-body);font-size:20px;line-height:1.2;-webkit-font-smoothing:none}
*{box-sizing:border-box}
.app{max-width:1000px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:12px 32px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 14px}
.brand{font-family:var(--f-display);font-size:13px;color:var(--sun);letter-spacing:.06em;text-shadow:2px 2px 0 var(--red);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font-family:var(--f-display);font-size:10px;letter-spacing:.04em;padding:7px 9px;background:var(--k);border:2px solid var(--slate);color:var(--white);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.money{color:var(--lime)} .chip.rep{color:var(--sun)}
.tbtn{font-family:var(--f-display);font-size:10px;letter-spacing:.04em;padding:7px 9px;background:var(--navy);color:var(--aqua);border:2px solid var(--aqua);cursor:pointer}
.tbtn:hover{background:var(--blue)}
.tbtn[disabled]{opacity:.4;cursor:not-allowed}
.stage{width:min(100%, calc((100vh - 300px) * 1.7778));width:min(100%, calc((100dvh - 300px) * 1.7778));min-width:min(100%, 560px);margin-inline:auto;border:4px solid var(--k);box-shadow:0 0 0 4px var(--slate),0 0 0 8px var(--k);background:var(--k)}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation}
.panel{background:var(--dusk);border:4px solid var(--k);box-shadow:inset 0 0 0 3px var(--slate);padding-block:16px;padding-inline:18px;min-width:0}
h2,h3{font-family:var(--f-display);font-weight:400;color:var(--sun);margin:0;text-wrap:balance;letter-spacing:.04em;line-height:1.5}
h2{font-size:13px} h3{font-size:10px;color:var(--aqua)}
p{margin:0;max-width:68ch}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--mist)}
.small{font-size:18px}
.btn{font-family:var(--f-display);font-size:11px;letter-spacing:.04em;line-height:1.4;padding:11px 14px;background:var(--orange);color:var(--k);border:3px solid var(--k);box-shadow:inset -3px -3px 0 var(--red),inset 3px 3px 0 var(--sun);cursor:pointer}
.btn:hover{filter:brightness(1.06)}
.btn:active{box-shadow:inset 3px 3px 0 var(--red)}
.btn.blue{background:var(--sky);box-shadow:inset -3px -3px 0 var(--blue),inset 3px 3px 0 var(--aqua)}
.btn.ghost{background:var(--k);color:var(--mist);box-shadow:inset 0 0 0 2px var(--slate)}
.btn[disabled]{background:var(--slate);color:var(--dusk);box-shadow:none;cursor:not-allowed;filter:none}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--aqua);outline-offset:2px}
.card{background:var(--k);border:2px solid var(--slate);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.quote{font-size:23px;color:var(--white);border-left:4px solid var(--orange);padding-left:12px}
.tag{display:inline-block;font-family:var(--f-display);font-size:9px;letter-spacing:.05em;padding:5px 7px;background:var(--navy);color:var(--aqua);border:2px solid var(--k)}
.tag.warn{background:var(--plum);color:var(--sun)}
/* shaping steps */
.step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start}
.num{font-family:var(--f-display);font-size:13px;width:32px;height:32px;display:grid;place-items:center;background:var(--sun);color:var(--k);border:3px solid var(--k);box-shadow:inset -3px -3px 0 var(--orange)}
.opt small{font-size:16px;color:var(--mist)}
.opt[aria-pressed="true"] small{color:var(--dusk)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.checks li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px;align-items:baseline}
.checks .mk{font-family:var(--f-display);font-size:10px}
.checks .ok{color:var(--lime)} .checks .close{color:var(--sun)} .checks .off{color:var(--orange)}
.fit{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.fit .lbl{margin:0}
.fitbar{height:14px;background:var(--k);border:2px solid var(--slate);display:block}
.fitbar span{display:block;height:100%}
/* shaping */
.shape-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}
@media (max-width:780px){.shape-grid{grid-template-columns:minmax(0,1fr)}}
fieldset{border:0;padding:0;margin:0;min-width:0;display:flex;flex-direction:column;gap:6px}
legend,.lbl{font-family:var(--f-display);font-size:9px;letter-spacing:.06em;color:var(--mist);padding:0;margin-bottom:6px;text-transform:uppercase}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{font-family:var(--f-body);font-size:19px;line-height:1;padding:6px 9px;background:var(--k);color:var(--white);border:2px solid var(--slate);cursor:pointer}
.opt:hover{border-color:var(--mist)}
.opt[aria-pressed="true"]{background:var(--aqua);color:var(--k);border-color:var(--aqua)}
.opt.locked{color:var(--slate);border-style:dashed;cursor:not-allowed}
.opt.locked i{font-style:normal;color:var(--orange)}
.tip{font-size:18px;color:var(--mist);min-height:1.2em}
.sl{display:grid;grid-template-columns:96px minmax(0,1fr) 92px;align-items:center;gap:10px}
.sl output{font-family:var(--f-display);font-size:10px;color:var(--sun);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;background:var(--k);border:2px solid var(--slate)}
input[type=range]::-moz-range-track{height:8px;background:var(--k);border:2px solid var(--slate)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:22px;margin-top:-9px;background:var(--sun);border:3px solid var(--k);box-shadow:inset -2px -2px 0 var(--orange)}
input[type=range]::-moz-range-thumb{width:10px;height:18px;background:var(--sun);border:3px solid var(--k);border-radius:0}
.stats{display:flex;flex-direction:column;gap:7px}
.stat{display:grid;grid-template-columns:78px minmax(0,1fr) 38px;gap:8px;align-items:center}
.stat .nm{font-family:var(--f-display);font-size:9px;letter-spacing:.04em;color:var(--white)}
.stat .vl{font-family:var(--f-display);font-size:9px;color:var(--mist);text-align:right;font-variant-numeric:tabular-nums}
.bar{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:2px}
.c{height:13px;background:var(--k);border:1px solid var(--dusk)}
.c.on{background:var(--col,var(--lime));border-color:var(--col,var(--lime))}
.c.tgt{outline:2px solid var(--sun);outline-offset:1px}
.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;font-variant-numeric:tabular-nums}
.specs b{font-family:var(--f-display);font-size:9px;font-weight:400;color:var(--mist);display:block;margin-bottom:2px;letter-spacing:.05em}
/* surf pad */
.surfbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center}
@media (max-width:640px){.surfbar{grid-template-columns:auto auto;justify-content:space-between}.surfbar .legend{grid-column:1 / -1;order:3}}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:4px;touch-action:none}
.pk{font-family:var(--f-display);font-size:14px;background:var(--navy);color:var(--aqua);border:3px solid var(--k);box-shadow:inset -3px -3px 0 var(--k),inset 3px 3px 0 var(--blue);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.pk.on{background:var(--aqua);color:var(--k)}
.pk.u{grid-column:2;grid-row:1}.pk.l{grid-column:1;grid-row:2}.pk.r{grid-column:3;grid-row:2}.pk.d{grid-column:2;grid-row:3}
.pk.a{width:84px;height:84px;border-radius:50%;background:var(--red);color:var(--white);box-shadow:inset -4px -4px 0 var(--plum),inset 4px 4px 0 var(--orange);font-size:16px}
.pk.a.on{background:var(--orange)}
.legend{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;font-size:18px;min-width:0}
.legend kbd{font-family:var(--f-display);font-size:9px;color:var(--sun);white-space:nowrap;padding-top:4px}
/* notebook */
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.entries{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.entry h3{color:var(--sun)}
.entry .era{font-family:var(--f-display);font-size:9px;color:var(--aqua);letter-spacing:.04em}
.entry .game{font-size:18px;color:var(--lime)}
.entry button.h{all:unset;cursor:pointer}
.entry button.h:focus-visible{outline:3px solid var(--aqua)}
.entry.sel{border-color:var(--aqua)}
.tl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 14px}
.tl b{font-family:var(--f-display);font-size:10px;font-weight:400;color:var(--sun);padding-top:4px}
.up-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}
.up .price{font-family:var(--f-display);font-size:11px;color:var(--lime)}
.owned{font-family:var(--f-display);font-size:9px;color:var(--green)}
.review li{margin-bottom:4px}
.review ul{margin:0;padding-left:20px}
.good{color:var(--lime)} .bad{color:var(--orange)}
.scorebox{display:flex;flex-wrap:wrap;gap:10px}
.scorebox .card{flex:1 1 120px;align-items:flex-start}
.big{font-family:var(--f-display);font-size:18px;color:var(--sun);font-variant-numeric:tabular-nums}
details summary{font-family:var(--f-display);font-size:10px;color:var(--aqua);cursor:pointer;letter-spacing:.04em}
details[open] summary{margin-bottom:8px}
.quiver{display:flex;flex-wrap:wrap;gap:6px}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <h1 class="brand">SALT SHACK SHAPES</h1>
    <div class="chips" id="chips"></div>
  </header>
  <div class="stage"><canvas id="cv" width="640" height="360" role="img" aria-label="Game screen"></canvas></div>
  <section class="panel" id="panel" aria-live="polite"></section>
</div>

<script>
(() => {
'use strict';
/* ============================== BASICS ============================== */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const panel = document.getElementById('panel');
const chips = document.getElementById('chips');
const W = 320, H = 180, TY = 164, HY = 98, RX = 172;
const P = {k:'#1a1c2c',plum:'#5d275d',red:'#b13e53',orange:'#ef7d57',sun:'#ffcd75',lime:'#a7f070',green:'#38b764',teal:'#257179',navy:'#29366f',blue:'#3b5dc9',sky:'#41a6f6',aqua:'#73eff7',white:'#f4f4f4',mist:'#94b0c2',slate:'#566c86',dusk:'#333c57'};
const u32 = h => { const n = parseInt(h.slice(1),16); return ((255<<24)|((n&255)<<16)|(((n>>8)&255)<<8)|((n>>16)&255))>>>0; };
const U = {}; for (const k in P) U[k] = u32(P[k]);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const rnd = (a,b) => a + Math.random()*(b-a);
const rint = (a,b) => Math.floor(rnd(a,b+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
function resetT(){ ctx.setTransform(2,0,0,2,0,0); ctx.imageSmoothingEnabled = false; }
function rect(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
function text(s,x,y,c=P.white,size=8,align='left',shadow=P.k){
  ctx.font = size+'px "Press Start 2P", monospace'; ctx.textAlign=align; ctx.textBaseline='top';
  if (shadow){ ctx.fillStyle=shadow; ctx.fillText(s,Math.round(x)+1,Math.round(y)+1); }
  ctx.fillStyle=c; ctx.fillText(s,Math.round(x),Math.round(y));
}
function hash(x,y,f){ let h = (x*374761393 + y*668265263 + f*2147483647)|0; h = (h^(h>>>13))*1274126177|0; return (h^(h>>>16))>>>0; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmtLen(i){ i=Math.round(i); return `${Math.floor(i/12)}'${i%12}"`; }
function frac(n, den=8){ const w=Math.floor(n+1e-6); let r=Math.round((n-w)*den); if(r===den) return `${w+1}`; if(!r) return `${w}`; let d=den; while(r%2===0&&d%2===0){r/=2;d/=2;} return `${w} ${r}/${d}`; }
function fmtIn(n,den=8){ return frac(n,den)+'"'; }

/* ============================== SOUND ============================== */
let actx=null, muted=false;
function ac(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } } return actx; }
function beep(f=440,d=0.08,type='square',vol=0.05,slide=0,delay=0){
  if(muted) return; const a=ac(); if(!a) return;
  try{ const t=a.currentTime+delay, o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+0.02);}catch(e){}
}
function noise(d=0.5,vol=0.08){
  if(muted) return; const a=ac(); if(!a) return;
  try{ const n=Math.floor(a.sampleRate*d), b=a.createBuffer(1,n,a.sampleRate), ch=b.getChannelData(0); for(let i=0;i<n;i++) ch[i]=(Math.random()*2-1)*(1-i/n);
    const s=a.createBufferSource(), g=a.createGain(); s.buffer=b; g.gain.value=vol; s.connect(g).connect(a.destination); s.start(); }catch(e){}
}
const sfx = {
  click:()=>beep(660,0.05,'square',0.03),
  paddle:()=>beep(180,0.06,'triangle',0.06,-60),
  pop:()=>{beep(392,0.07);beep(523,0.07,'square',0.05,0,0.07);beep(784,0.1,'square',0.05,0,0.14);},
  trick:(n=0)=>{const b=523+n*40;beep(b,0.06);beep(b*1.25,0.06,'square',0.05,0,0.06);beep(b*1.5,0.09,'square',0.05,0,0.12);},
  big:()=>{[523,659,784,1047].forEach((f,i)=>beep(f,0.09,'square',0.05,0,i*0.08));},
  wipe:()=>{noise(0.7,0.09);beep(300,0.4,'sawtooth',0.04,-240);},
  cash:()=>{beep(988,0.06,'square',0.04);beep(1319,0.14,'square',0.04,0,0.06);},
  plane:()=>beep(90+Math.random()*30,0.05,'sawtooth',0.02),
  pump:()=>beep(240,0.04,'triangle',0.05,80),
};

/* ============================== DATA: MATERIALS / SHAPES / PARTS ============================== */
const MATERIALS = {
  wood:{name:'Solid Wood',short:'Koa',density:1.1,cost:20,unlock:0,glide:0.4,hold:0.3,turn:-0.5,paddle:-0.2,stringer:false,
    tip:'Koa & redwood. Heavy, glides forever, slow to turn. The original.'},
  balsa:{name:'Balsa + Glass',short:'Balsa',density:0.42,cost:55,unlock:0,glide:0.3,hold:0.3,
    tip:'1940s–50s. Light wood sealed in fiberglass. Smooth, damp, classic.'},
  pu:{name:'PU Foam',short:'PU',density:0.24,cost:45,unlock:250,
    tip:'Polyurethane + polyester, c.1958. The do-everything standard.'},
  soft:{name:'Soft-Top',short:'Soft',density:0.32,cost:40,unlock:180,stab:2,turn:-0.8,hold:-0.8,glide:-0.8,paddle:0.3,
    tip:'Foam deck, slick bottom. Safe and stable; mushy in turns.'},
  eps:{name:'EPS + Epoxy',short:'Epoxy',density:0.17,cost:70,unlock:450,paddle:0.6,glide:0.5,hold:-0.8,turn:0.3,
    tip:'Bead foam + epoxy. Floaty and fast; corky at speed in big surf.'},
};
const TEMPLATES = {
  olo:{name:'Olo',min:144,max:204,vf:0.65,noseA:2.2,tailW:0.5,wp:0.45,noseF:0,unlock:0,
    def:{L:180,W:19,T:3.25,rocker:1,tail:'round',fins:'none',rails:'soft'},tip:'Ancient Hawaiian chief\'s board. Enormous, straight, finless.'},
  log:{name:'Longboard',min:108,max:126,vf:0.56,noseA:4.5,tailW:0.72,wp:0.5,noseF:2.5,unlock:0,
    def:{L:114,W:23,T:3,rocker:2,tail:'square',fins:'single',rails:'soft'},tip:'The Malibu log. Wide round nose for hanging ten.'},
  gun:{name:'Gun',min:90,max:132,vf:0.54,noseA:1.4,tailW:0.25,wp:0.55,noseF:0,unlock:0,
    def:{L:114,W:20,T:3.25,rocker:4,tail:'pin',fins:'single',rails:'medium'},tip:'Long, narrow, pin tail. Built to hunt giant waves.'},
  minimal:{name:'Mini-Mal',min:84,max:102,vf:0.56,noseA:3.2,tailW:0.62,wp:0.5,noseF:1,unlock:120,
    def:{L:96,W:22,T:2.875,rocker:2,tail:'round',fins:'2+1',rails:'soft'},tip:'A shrunken Malibu. Easy paddle, more turn than a log.'},
  alaia:{name:'Alaia',min:72,max:132,vf:0.68,noseA:3,tailW:0.78,wp:0.5,noseF:0,unlock:0,
    def:{L:90,W:17.5,T:1,rocker:1,tail:'square',fins:'none',rails:'soft'},tip:'Thin, flat, finless Hawaiian board. Fast, slidey, unstable.'},
  egg:{name:'Egg',min:78,max:96,vf:0.55,noseA:2.6,tailW:0.45,wp:0.48,noseF:0.5,unlock:150,
    def:{L:84,W:21.5,T:2.75,rocker:3,tail:'round',fins:'single',rails:'soft'},tip:'Rounded mid-length. Long, smooth carves.'},
  short:{name:'Shortboard',min:66,max:84,vf:0.53,noseA:1.3,tailW:0.5,wp:0.42,noseF:0,unlock:300,
    def:{L:72,W:19.25,T:2.375,rocker:4,tail:'squash',fins:'thruster',rails:'hard'},tip:'Post-1967 performance shape. Vertical turns and airs.'},
  hybrid:{name:'Hybrid',min:62,max:72,vf:0.55,noseA:1.9,tailW:0.62,wp:0.45,noseF:0,unlock:220,
    def:{L:68,W:20.75,T:2.625,rocker:3,tail:'squash',fins:'quad',rails:'medium'},tip:'Modern groveler: shortboard rails, fish-like volume.'},
  fish:{name:'Fish',min:60,max:72,vf:0.54,noseA:1.8,tailW:0.75,wp:0.4,noseF:0,unlock:200,
    def:{L:66,W:21,T:2.5,rocker:2,tail:'swallow',fins:'twin',rails:'medium'},tip:'Steve Lis, c.1967. Wide, flat, swallow tail, twin keels.'},
};
const TPL_ORDER = ['olo','log','gun','minimal','alaia','egg','short','hybrid','fish'];
const HIST_MAT = {olo:'wood',alaia:'wood',log:'balsa',gun:'balsa',minimal:'pu',egg:'pu',short:'pu',hybrid:'eps',fish:'pu'};
const TAILS = {
  square:{name:'Square',turn:0,hold:-0.3,glide:0.3,nose:1,tip:'Pivots and holds trim. The noserider\'s tail.'},
  squash:{name:'Squash',turn:0.5,hold:0,glide:0.1,nose:0.5,tip:'Square with rounded corners. The all-rounder.'},
  round:{name:'Round',turn:0.3,hold:1,glide:0,nose:0.3,tip:'Smooth drawn-out turns, holds in hollow waves.'},

function calcStats(b){
  const tp=TEMPLATES[b.tpl], m=MATERIALS[b.mat], tl=TAILS[b.tail], f=FINS[b.fins], r=RAILS[b.rails];
  const ft=b.L/12;
  const vol=b.L*b.W*b.T*0.016387*tp.vf;
  const weight=vol*m.density+(b.mat==='wood'?0:1.5);
  const s={};
  s.paddle = Math.sqrt(vol)*0.75 + (ft-6)*0.4 - Math.max(0,weight-22)*0.03 + (m.paddle||0);
  s.stab   = (b.W-17)*0.8 + Math.sqrt(vol)*0.4 + (m.stab||0) + r.stab;
  s.turn   = 8 - (ft-5)*0.8 + (b.rocker-3)*0.6 + tl.turn + f.turn + r.turn - weight*0.03 + (m.turn||0);
  s.glide  = 1 + (ft-5)*0.9 + (3-b.rocker)*0.8 + Math.sqrt(vol)*0.25 + (m.glide||0) + f.glide + tl.glide + r.glide;
  s.hold   = 3.5 + (ft-6)*0.6 + tl.hold + f.hold + r.hold + (21-b.W)*0.6 + (b.rocker-3)*0.4 + Math.min(weight,40)*0.03 + (m.hold||0);
  s.nose   = (Math.min(ft,10.5)-8)*1.5 + (b.W-20)*0.6 + tp.noseF + (3-b.rocker)*0.5 + tl.nose + f.nose + r.nose + Math.min(weight,30)*0.05;
  for(const k in s) s[k]=Math.round(clamp(s[k],0,10)*10)/10;
  return {s, vol, weight};
}

/* ============================== BOARD DRAWING ============================== */
function halfFrac(b,t){
  const tp=TEMPLATES[b.tpl], wp=tp.wp; let s;
  if(t>=wp){ const u=(t-wp)/(1-wp); s=Math.sqrt(Math.max(0,1-Math.pow(u,tp.noseA))); }
  else { const u=(wp-t)/wp; s=1-(1-tp.tailW)*u*u; }
  switch(b.tail){
    case 'pin': if(t<0.22) s*=Math.pow(t/0.22,0.75); break;
    case 'round': if(t<0.08) s*=Math.sqrt(t/0.08); break;
    case 'squash': if(t<0.025) s*=0.72+0.28*(t/0.025); break;
    case 'diamond': if(t<0.06) s*=0.45+0.55*(t/0.06); break;
  }
  return s;
}
function matCols(m){
  return {wood:{base:P.orange,alt:P.red,edge:P.plum,str:null},balsa:{base:P.sun,alt:'#f0b860',edge:P.orange,str:P.red},
          pu:{base:P.white,alt:P.white,edge:P.mist,str:P.orange},soft:{base:P.sky,alt:P.blue,edge:P.white,str:null},
          eps:{base:P.white,alt:P.aqua,edge:P.aqua,str:null}}[m];
}
const bcache=new Map();
function boardCanvas(b,sc,orient,ghost){
  const key=[b.mat,b.tpl,b.L,b.W,b.tail,sc,orient,ghost?1:0].join('|');
  if(bcache.has(key)) return bcache.get(key);
  const Lp=Math.max(4,Math.round(b.L*sc)), Wp=Math.max(3,b.W*sc);
  const c=document.createElement('canvas'); const wd=Math.ceil(Wp)+2;
  c.width=orient==='h'?Lp:wd; c.height=orient==='h'?wd:Lp;
  const g=c.getContext('2d'); const col=matCols(b.mat); const mid=wd/2;
  for(let i=0;i<Lp;i++){
    const t=(i+0.5)/Lp; const hw=Math.round(halfFrac(b,t)*Wp/2); if(hw<1) continue;
    const notch = b.tail==='swallow' && t<0.1 ? Math.round(hw*0.6*(1-t/0.1)) : -1;
    for(let o=-hw;o<hw;o++){
      if(notch>=0 && Math.abs(o+0.5)<notch) continue;
      let c2;
      const edge = (o===-hw||o===hw-1);
      if(ghost) c2 = edge?P.slate:P.dusk;
      else if(edge) c2=col.edge;
      else if(col.str && o===0) c2=col.str;
      else if(b.mat==='wood') c2 = ((o+hw+Math.round(Math.sin(i*0.08)*1.5))%4===0)?col.alt:col.base;
      else if(b.mat==='balsa') c2 = ((o+hw)%5===0)?col.alt:col.base;
      else if(b.mat==='soft') c2 = (Math.abs(o)===hw-2)?P.white:(((i>>1)+(o>>1))%3===0?col.alt:col.base);
      else if(b.mat==='eps') c2 = (hash(i,o,7)%11===0)?P.mist:col.base;
      else c2=col.base;
      g.fillStyle=c2;
      const p = Math.floor(mid+o);
      if(orient==='h') g.fillRect(i,p,1,1); else g.fillRect(p,Lp-1-i,1,1);
    }
  }
  if(bcache.size>80) bcache.clear();
  bcache.set(key,c); return c;
}
function drawBoard(b,cx,cy,sc,orient='h',ghost=false){
  const c=boardCanvas(b,sc,orient,ghost); ctx.drawImage(c,Math.round(cx-c.width/2),Math.round(cy-c.height/2));
  return c;
}
function rockerAt(b,t){ const nr=1.2+b.rocker*1.0, tr=0.5+b.rocker*0.5; return nr*Math.pow(Math.max(0,t-0.5)*2,2.2)+tr*Math.pow(Math.max(0,0.5-t)*2,2); }
function drawProfile(b,cx,cy,sc){
  const Lp=Math.round(b.L*sc), x0=Math.round(cx-Lp/2), col=matCols(b.mat), ex=2;
  for(let i=0;i<Lp;i++){
    const t=(i+0.5)/Lp; const z=rockerAt(b,t)*sc*ex;
    const th=Math.max(1,Math.round(b.T*sc*(1-Math.pow(Math.abs(t-0.45)/0.55,2)*0.75)*1.4));
    const by=Math.round(cy-z);
    rect(x0+i,by-th,1,th,col.base); rect(x0+i,by,1,1,col.edge); rect(x0+i,by-th,1,1,col.edge);
  }
  const finAt=(t,depthIn,baseIn,c=P.k)=>{ const x=x0+Math.round(t*Lp), by=Math.round(cy-rockerAt(b,t)*sc*ex)+1, d=Math.max(2,Math.round(depthIn*sc)), bs=Math.max(2,Math.round(baseIn*sc));
    for(let j=0;j<d;j++){ const w=Math.max(1,Math.round(bs*(1-j/d))); rect(x-Math.round(j*0.6),by+j,w,1,c);} };
  const big=b.L>=108?8:6.5;
  switch(b.fins){
    case 'single': finAt(0.05,big,5); break;
    case '2+1': finAt(0.06,big-1,4.5); finAt(0.15,3.5,3,P.slate); break;
    case 'twin': finAt(0.06,5,7); break;
    case 'thruster': finAt(0.035,4.5,4); finAt(0.13,4.5,4,P.slate); break;
    case 'quad': finAt(0.07,4,3.8); finAt(0.13,4.3,4,P.slate); break;
  }
}

// people are drawn 1.5x: on the 2x canvas every sprite pixel becomes exactly 3 screen pixels, so they stay crisp
const PSC=1.5;
function drawPerson(x,y,lk,pose='stand',f=0,flip=false){
  ctx.save(); ctx.translate(Math.round(x),Math.round(y)); ctx.scale(PSC,PSC);

function drawPersonRaw(x,y,lk,pose='stand',f=0,flip=false){

    const st = pose==='walk' ? (Math.floor(f*8)%2) : 0;
    rect(x-2,y-6,2,6-st,lk.skin); rect(x+1,y-6,2,6-(pose==='walk'?(1-st):0),lk.skin);
    rect(x-3,y-10,7,4,lk.shorts); rect(x-3,y-16,7,6,lk.shirt);
    rect(x-4,y-15,1,5,lk.skin); rect(x+4,y-15,1,5,lk.skin);
    head(x-2,y-21,flip?-1:1); break; }
  case 'wave':
    drawPersonRaw(x,y,lk,'stand',0,flip); rect(flip?x-5:x+5,y-22,1,7,lk.skin); rect(flip?x-6:x+5,y-23,2,2,lk.skin); break;

    rect(x-3,y-9,7,4,lk.shorts); rect(x-3,y-15,7,6,lk.shirt);
    rect(x-5,y-22,1,8,lk.skin); rect(x+5,y-22,1,8,lk.skin); rect(x-6,y-23,2,2,lk.skin); rect(x+5,y-23,2,2,lk.skin);
    head(x-2,y-20); break;
  case 'surf': case 'tube': case 'nose': case 'grab': case 'rise': {
    const low = pose==='tube'||pose==='grab'?3:pose==='rise'?4:pose==='nose'?-1:1;
    rect(x-4,y-5+low,2,5-low,lk.skin); rect(x+3,y-5+low,2,5-low,lk.skin);

  case 'spin': {

function startSession(){

    resp:clamp((2+st.turn*0.55)/(1+Math.max(0,ft-6)*0.22+r.weight/60),0.6,8),
    turnRate:(0.75+st.turn*0.14)/(1+Math.max(0,ft-7)*0.12),

function faceH(dd){ return surf.Hmax*clamp(1-Math.max(0,dd-110)/320,0.32,1); }
function curlSX(){ return RX-(surf.x-surf.cx); }

function popText(txt,c=P.sun){ surf.pops.push({txt,c,t:0}); }
function award(kind,base,label,c){

function judge(pts){ return Math.round(100*(1-Math.exp(-pts/1900)))/10; }

function tip(id,txt){ const sv=surf; if(sv.tips[id]) return; sv.tips[id]=true; sv.hint={txt,t:0}; }

      <div class="step"><span class="num">1</span><div class="stack">
        ${optGroup('Pick a shape','tpl',TEMPLATES,S.unlocked.tpl)}
        ${optGroup('Pick a material','mat',MATERIALS,S.unlocked.mat)}
      </div></div>
      <div class="step"><span class="num">2</span><fieldset><legend>Tune it</legend>
        <div class="sl"><label for="r-L" class="small">Length</label><input type="range" id="r-L" data-r="L" min="${tp.min}" max="${tp.max}" step="1" value="${b.L}"><output id="o-L">${fmtLen(b.L)}</output></div>
        <div class="sl"><label for="r-F" class="small">Float</label><input type="range" id="r-F" data-r="float" min="-2" max="2" step="1" value="${fl}"><output id="o-F">${FLOAT_LBL[fl+2]}</output></div>
        <div class="sl"><label for="r-R" class="small">Rocker</label><input type="range" id="r-R" data-r="rocker" min="1" max="5" step="1" value="${b.rocker}"><output id="o-R">${ROCKER_LBL[b.rocker]}</output></div>
        <div class="tip">Longer: paddles and glides, turns slower. More float: stable and easy to paddle. More rocker: turns tighter and handles steep drops, but slower.</div>
      </fieldset></div>
      <div class="step"><span class="num">3</span><div class="stack">
        ${optGroup('Pick a tail','tail',TAILS,null)}
        ${optGroup('Pick fins','fins',FINS,S.unlocked.fin)}
      </div></div>
    </div>
    <div class="stack" id="readout">${readoutHTML()}</div>
   </div>
  </div>`;
}
function boardFit(b){
  const a=ARCH_BY[S.customer.arch], st=calcStats(b).s;
  const parts=a.crit.map(cr=>({cr,s:cr.f(b,st)}));
  const tw=parts.reduce((p,x)=>p+x.cr.w,0);
  return {parts, fit:parts.reduce((p,x)=>p+x.cr.w*x.s,0)/tw};
}
function readoutHTML(){
  const b=S.board, r=calcStats(b), c=S.customer;
  const {parts,fit}=boardFit(b);
  const checks=parts.map(p=>{ const k=p.s>=0.9?'ok':p.s>=0.5?'close':'off'; return `<li class="${k}"><span class="mk" aria-hidden="true">${k==='ok'?'✓':k==='close'?'~':'✗'}</span><span>${esc(critLabel(p.cr))}</span></li>`; }).join('');
  const tg={}; ARCH_BY[c.arch].crit.forEach(cr=>{ if(cr.stat) tg[cr.stat]=cr.target; });
  const bars=STATS.map(([k,nm,col])=>{ const v=r.s[k]; const cells=Array.from({length:10},(_,i)=>`<span class="c${i<Math.round(v)?' on':''}${tg[k]!==undefined&&i===Math.ceil(tg[k])-1?' tgt':''}"></span>`).join('');
    return `<div class="stat" style="--col:${col}"><span class="nm">${nm}</span><span class="bar" aria-hidden="true">${cells}</span><span class="vl">${v.toFixed(1)}</span></div>`; }).join('');
  const cost=blankCost(b); const can=S.money>=cost; const pct=Math.round(fit*100);
  return `<h3>${esc(c.name.toUpperCase())}'S CHECKLIST</h3>
   <ul class="checks">${checks}</ul>
   <div class="fit"><span class="lbl">BOARD FIT</span><span class="fitbar"><span style="width:${pct}%;background:${pct>=85?'var(--lime)':pct>=60?'var(--sun)':'var(--orange)'}"></span></span><span class="big">${pct}%</span></div>
   <h3>RIDE CHARACTER</h3>
   <div class="stats" role="list" aria-label="Board stats">${bars}</div>
   <div class="specs"><div><b>SIZE</b>${fmtLen(b.L)} × ${fmtIn(b.W,4)} × ${fmtIn(b.T)}</div><div><b>VOLUME</b>${r.vol.toFixed(1)} L · ${Math.round(r.weight)} lb</div><div><b>RAILS</b>${esc(RAILS[b.rails].name)}</div><div><b>BLANK COST</b>$${cost}</div></div>
   <div class="row"><button class="btn" id="b-glass" data-act="glass" ${can?'':'disabled'}>GLASS IT & TEST RIDE · $${cost}</button>
   <button class="btn ghost" id="b-back" data-act="toshop">BACK</button></div>
   ${can?'':`<p class="bad small">Not enough cash for this blank. Wood blanks are cheaper, and shorter boards use less.</p>`}`;
}
function legendHTML(){
  return `<div class="legend">
   <kbd>SPACE · A BTN · →</kbd><span>Paddle (tap fast as the swell arrives)</span>
   <kbd>↑ / W</kbd><span>Pop up, then climb the face</span>
   <kbd>↓ / S</kbd><span>Drop down the face (gains speed)</span>
   <kbd>→ / D</kbd><span>Pump for speed</span>
   <kbd>← / A KEY</kbd><span>Stall back toward the curl; hold on the shoulder to cut back</span>
   <kbd>HOLD SPACE / A</kbd><span>Mid-face: walk to the nose. At the lip with speed: air</span>
  </div>`;
}
const MOVES=[
  ['Bottom turn','Drop to the bottom, then press ↑.'],
  ['Top turn / Off the lip','Climb to the top, then press ↓. Near the curl it counts as off the lip.'],
  ['Tail slide','Hold ← while you turn off the top. Needs a loose board.'],
  ['Floater','Hold ↑ along the lip near the curl, then come back down before you stall.'],
  ['Cutback / Roundhouse','On the shoulder, hold ←. Go in fast for a roundhouse.'],
  ['Drop-knee turn','Boards 8 ft+: hold A through a bottom turn.'],
  ['Noseride, hang five, hang ten','Hold A while trimming mid-face. Release before the NOSE meter fills.'],
  ['Spinner','Double-tap A mid-face to spin 360° on your feet. Stable boards land it.'],
  ['Barrel + grab rail','Hollow waves: stall into the curl mid-face. Hold A to grab your rail and go deeper.'],
  ['Air','Hit the lip fast going up and press A.'],
  ['Claim','Tap A while you kick out.'],
  ['Combo','Chain moves within 2.5 s to raise the multiplier.'],
];
function panelSurf(){
  const pk=(k,cls,lbl,aria)=>`<button class="pk ${cls}" data-key="${k}" aria-label="${aria}">${lbl}</button>`;
  return `<div class="surfbar">
    <div class="dpad">${pk('up','u','▲','Climb')}${pk('left','l','◀','Stall or cutback')}${pk('right','r','▶','Pump or paddle')}${pk('down','d','▼','Drop')}</div>
    ${legendHTML()}
    ${pk('a','a','A','Paddle, noseride or air')}
  </div>
  <details style="margin-top:12px"><summary>MOVE LIST</summary><div class="legend">${MOVES.map(([n,h])=>`<kbd>${esc(n.toUpperCase())}</kbd><span>${esc(h)}</span>`).join('')}</div></details>
  <div class="row" style="margin-top:12px"><button class="btn ghost" id="b-end" data-act="endsurf">END SESSION</button><span class="muted small">Three waves. Judges score each one out of 10.</span></div>`;
}
function panelResults(){
  const R=S.last; if(!R) return '';
  const a=ARCH_BY[R.arch];
  const crit=R.parts.map(p=>`<li class="${p.s>=0.9?'good':p.s<0.6?'bad':''}">${esc(p.lbl)}: ${Math.round(p.s*100)}%</li>`).join('');
  return `<div class="stack">
   ${R.legend?`<p class="good">That makes four stars or better for every kind of surfer in town. You're a legend of the coast.</p>`:''}
   <div class="row"><h2>${esc(R.name)}'s review · ${R.stars.toFixed(1)}★</h2></div>
   <div class="card review">
     ${R.good.map(g=>`<p class="good">“${esc(g)}”</p>`).join('')}
     ${R.bad.map(g=>`<p class="bad">“${esc(g)}”</p>`).join('')}
     <p>“${esc(R.surfLine)}”</p>
   </div>
   <div class="scorebox">
     <div class="card"><b class="lbl">BOARD FIT</b><span class="big">${Math.round(R.fit*100)}%</span></div>
     <div class="card"><b class="lbl">WAVES</b><span class="big">${R.scores.map(s=>s.judge.toFixed(1)).join(' · ')}</span></div>
     <div class="card"><b class="lbl">PAID</b><span class="big">$${R.pay}</span></div>
     <div class="card"><b class="lbl">TIP</b><span class="big">$${R.tip}</span></div>
   </div>
   <details><summary>WHAT ${esc(R.name.toUpperCase())} WAS JUDGING</summary><ul class="review">${crit}</ul></details>
   <div class="row"><button class="btn" id="b-shop" data-act="toshop">NEXT CUSTOMER</button><button class="btn blue" id="b-up2" data-act="upgrades">SUPPLY ORDER</button></div>
  </div>`;
}
function panelUpgrades(){
  const items=[];
  for(const [k,m] of Object.entries(MATERIALS)) if(m.unlock) items.push({cat:'mat',k,name:m.name,kind:'Material',cost:m.unlock,tip:m.tip});
  for(const [k,m] of Object.entries(TEMPLATES)) if(m.unlock) items.push({cat:'tpl',k,name:m.name,kind:'Template',cost:m.unlock,tip:m.tip});
  for(const [k,m] of Object.entries(FINS)) if(m.unlock) items.push({cat:'fin',k,name:m.name+' fins',kind:'Fins',cost:m.unlock,tip:m.tip});
  items.sort((x,y)=>x.cost-y.cost);
  const cards=items.map(it=>{ const own=S.unlocked[it.cat].includes(it.k);
    return `<div class="card up"><div class="row"><h3>${esc(it.name.toUpperCase())}</h3><span class="tag">${it.kind.toUpperCase()}</span></div><p class="small">${esc(it.tip)}</p>
     ${own?'<span class="owned">IN THE SHOP</span>':`<div class="row"><span class="price">$${it.cost}</span><button class="btn" id="u-${it.cat}-${it.k.replace('+','p')}" data-act="buy" data-cat="${it.cat}" data-k="${it.k}" ${S.money>=it.cost?'':'disabled'}>BUY</button></div>`}</div>`; }).join('');
  return `<div class="stack"><div class="row"><h2>Supply order</h2><span class="muted">New materials, templates and fins bring new customers through the door.</span></div>
   <div class="up-grid">${cards}</div>
   <div class="row"><button class="btn" id="b-shop2" data-act="toshop">BACK TO THE SHOP</button></div></div>`;
}
function panelNotebook(){
  const tabs=[['materials','WOOD → FOAM'],['shapes','LONG → SHORT'],['anatomy','ANATOMY'],['timeline','TIMELINE']];
  const tabH=tabs.map(([k,l])=>`<button class="opt" id="nt-${k}" data-act="nbtab" data-k="${k}" aria-pressed="${nb.tab===k}">${l}</button>`).join('');
  let body='';
  if(nb.tab==='timeline'){ body=`<div class="tl">${NOTEBOOK.timeline.map(([y,e])=>`<b>${esc(y)}</b><span>${esc(e)}</span>`).join('')}</div>`; }
  else {
    body=`<div class="entries">${NOTEBOOK[nb.tab].map(e=>{
      const owned = e.tpl ? S.unlocked.tpl.includes(e.tpl) : e.key ? S.unlocked.mat.includes(e.key) : true;
      const head = e.tpl ? `<button class="h" id="nb-${e.id}" data-act="nbsel" data-k="${e.tpl}"><h3>${esc(e.title.toUpperCase())}</h3></button>` : `<h3>${esc(e.title.toUpperCase())}</h3>`;
      return `<article class="card entry${e.tpl&&nb.sel===e.tpl?' sel':''}">${head}<span class="era">${esc(e.era.toUpperCase())}${owned?'':' · NOT IN YOUR SHOP YET'}</span>${e.body.map(p=>`<p class="small">${esc(p)}</p>`).join('')}<p class="game">In the shop: ${esc(e.game)}</p></article>`;
    }).join('')}</div>`;
  }
  const back = prevScreen==='shape' ? 'BACK TO SHAPING' : 'BACK';
  return `<div class="stack"><div class="row"><h2>Shaper's notebook</h2>${nb.tab==='shapes'?'<span class="muted small">Tap a heading to light up that board in the lineup.</span>':''}</div>
   <div class="tabs" role="group" aria-label="Notebook sections">${tabH}</div>${body}
   <div class="row"><button class="btn" id="b-nbback" data-act="nbback">${back}</button></div></div>`;
}
let prevScreen='title';

/* ============================== EVENTS ============================== */
function initBoard(){
  const u=S.unlocked; const tpl=u.tpl.includes('log')?'log':u.tpl[0];
  applyTemplate(tpl, u.mat.includes('balsa')?'balsa':u.mat[0]);
}
function applyTemplate(tpl,mat){
  const d=TEMPLATES[tpl].def; const fins=S.unlocked.fin.includes(d.fins)?d.fins:'single';
  S.board={mat:mat||S.board.mat,tpl,L:d.L,W:d.W,T:d.T,float:0,rocker:d.rocker,tail:d.tail,fins,rails:d.rails};
}
function setFloat(fv){ const b=S.board, d=TEMPLATES[b.tpl].def; b.float=fv; b.W=clamp(d.W+fv*0.5,16.5,24); b.T=clamp(d.T+fv*0.25,0.75,4.5); }
panel.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el || el.disabled) return;
  ac(); const act=el.dataset.act; sfx.click();
  handleAct(act,el);
});
chips.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el) return; ac(); handleAct(el.dataset.act,el); });
function handleAct(act,el){
  switch(act){
    case 'start': confirmNew=false; hasSave=true; setScreen('shop'); break;
    case 'newgame': if(!confirmNew){ confirmNew=true; renderPanel(); } else { S=freshSave(); S.muted=muted; hasSave=false; confirmNew=false; save(); hasSave=true; setScreen('shop'); } break;
    case 'notebook': if(screen==='surf') return; if(screen!=='notebook'){ prevScreen=screen==='surf'?'shop':screen; } setScreen('notebook'); break;
    case 'nbback': setScreen(prevScreen==='notebook'?'shop':prevScreen); break;
    case 'nbtab': nb.tab=el.dataset.k; renderPanel(); break;
    case 'nbsel': nb.sel=el.dataset.k; renderPanel(); beep(520,0.05); break;
    case 'mute': muted=!muted; S.muted=muted; save(); renderChips(); break;
    case 'toshape': if(!S.board) initBoard(); setScreen('shape'); dust(); break;
    case 'nextcust': newCustomer(); renderPanel(); break;
    case 'upgrades': setScreen('upgrades'); break;
    case 'toshop': setScreen('shop'); break;
    case 'set': {
      const f=el.dataset.f, k=el.dataset.k;
      if(f==='tpl') applyTemplate(k,S.board.mat); else S.board[f]=k;
      save(); dust(); renderPanel(); break; }
    case 'glass': { const cost=blankCost(S.board); if(S.money<cost) return; S.money-=cost; save(); renderChips(); startSession(); break; }
    case 'buy': { const cat=el.dataset.cat,k=el.dataset.k; const dict={mat:MATERIALS,tpl:TEMPLATES,fin:FINS}[cat]; const cost=dict[k].unlock; if(S.money<cost) return;
      S.money-=cost; S.unlocked[cat].push(k); save(); sfx.cash(); renderPanel(); renderChips(); break; }
    case 'endsurf': if(surf){ if(surf.phase!=='between'){ surf.scores.push({pts:Math.round(surf.points),judge:judge(surf.points),note:''}); } while(surf.scores.length<3) surf.scores.push({pts:0,judge:0,note:''}); endSession(); } break;
  }
}
panel.addEventListener('input',e=>{
  const el=e.target; if(!el.dataset || !el.dataset.r || !S.board) return;
  const f=el.dataset.r; const v=parseFloat(el.value); const b=S.board;
  if(f==='float') setFloat(Math.round(v)); else b[f]= f==='rocker'?Math.round(v):v;
  const o={L:['o-L',fmtLen(b.L)],float:['o-F',FLOAT_LBL[(b.float||0)+2]],rocker:['o-R',ROCKER_LBL[b.rocker]]}[f];
  const out=document.getElementById(o[0]); if(out) out.textContent=o[1];
  const ro=document.getElementById('readout'); if(ro) ro.innerHTML=readoutHTML();
  if(Math.random()<0.4) dust(6);
});
panel.addEventListener('change',()=>save());
// touch / mouse pad
panel.addEventListener('pointerdown',e=>{ const el=e.target.closest('[data-key]'); if(!el) return; e.preventDefault(); ac(); try{el.setPointerCapture(e.pointerId);}catch(_){} press(el.dataset.key); el.classList.add('on'); });
const up=e=>{ const el=e.target.closest && e.target.closest('[data-key]'); if(!el) return; release(el.dataset.key); el.classList.remove('on'); };
panel.addEventListener('pointerup',up); panel.addEventListener('pointercancel',up); panel.addEventListener('lostpointercapture',up);
panel.addEventListener('contextmenu',e=>{ if(e.target.closest('[data-key]')) e.preventDefault(); });
const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'a',KeyZ:'a',KeyX:'a',KeyJ:'a',KeyK:'a'};
addEventListener('keydown',e=>{
  if(e.target && (e.target.tagName==='INPUT') && screen!=='surf') return;
  if(screen==='title' && (e.code==='Enter') && !(e.target && e.target.tagName==='BUTTON')){ ac(); handleAct('start'); return; }
  const k=KEYMAP[e.code]; if(!k) return;
  if(screen==='surf'){ e.preventDefault(); if(!e.repeat) ac(); press(k); }
});
addEventListener('keyup',e=>{ const k=KEYMAP[e.code]; if(k) release(k); });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=0; });
cv.addEventListener('click',()=>{ ac(); if(screen==='title') handleAct('start'); });

/* ============================== LOOP ============================== */
function frame(now){
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now; tick+=dt; shake=Math.max(0,shake-dt);
  resetT();
  try{
    switch(screen){
      case 'title': drawTitle(tick); break;
      case 'shop': drawShop(tick); break;
      case 'shape': drawShape(tick); break;
      case 'surf': if(surf){ updateSurf(dt); if(screen==='surf') drawSurf(tick); else resetT(); } break;
      case 'results': drawResults(tick-resultsT0()); break;
      case 'upgrades': drawUpgrades(tick); break;
      case 'notebook': drawLineup(tick); break;
    }
  }catch(err){ console.error(err); }
  for(const k in pressed) pressed[k]=false;
  requestAnimationFrame(frame);
}
let _rt=0, _rs=null; function resultsT0(){ if(_rs!==S.last){ _rs=S.last; _rt=tick; } return _rt; }
if(document.fonts && document.fonts.load){ document.fonts.load('8px "Press Start 2P"').catch(()=>{}); }
renderPanel(); renderChips();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
